# Release - 在 GitHub 云端手动试跑一次完整构建（备用）。
#
# 自动构建与发布由自有构建服务器负责（deploy/server/、docs/SERVER_CI.md）：推送到 main 覆盖滚动
# 预发布 nightly，推送 v* tag 发布同名 Release。所以这个工作流没有 push / tag 触发器，也不发布
# Release，免得两边同时改 nightly；它只在 Actions 页手动 Run workflow 时运行，用来在干净的云端
# 环境里验证构建，产物作为 artifact 保留 14 天（服务器不可用时也可以人工下载后手动发布）。
# 产物：dist/AFVI-Teach-Setup-<版本>.exe 与 dist/SHA256SUMS.txt。
# 构建由 scripts/build-wsl.sh 完成（gofmt、vet、纯 Go 测试、三个 exe、安装包）。

name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build installer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # 完整历史与 tag：版本号取 git describe（如 v0.1.0-rc2-3-gabc1234）。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # 提供 x86_64-w64-mingw32-gcc/g++ 与 windres，build-wsl.sh 需要。
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      # gofmt、vet、纯 Go 测试、三个 exe、安装包；reference/ 被 git 忽略且可能保密，
      # 所以安装包不含机台数据；-selftest 需要 Windows 桌面窗口，CI 不运行。
      - name: Build (checks, programs, installer)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-wsl.sh --version "$VERSION"

      - name: Write checksums
        run: |
          cd dist
          sha256sum AFVI-Teach-Setup-*.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AFVI-Teach-Setup
          path: |
            dist/AFVI-Teach-Setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
