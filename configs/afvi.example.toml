# AFVI Teach machine configuration (example).
#
# Copy this file to "bin/afvi.toml" next to the executable, or to "afvi.toml" in the
# project root, or pass -config <file>, and adjust the machines. The real afvi.toml is
# git-ignored because it holds machine addresses and local paths.
#
# Search order: -config flag, AFVI_CONFIG environment variable, afvi.toml next to the
# executable, afvi.toml in the working directory.
#
# Paths may be absolute (D:\FM1), UNC (\\server\share\FM1) or relative to this file.
# Use single quotes for Windows paths so backslashes are taken literally.

# Machine selected at startup (must match a [[machine]] name).
active = "REFERENCE"

# UI theme: "light" (classic, default) or "dark".
theme = "light"

# UI language: "zh", "en" or "ko".
lang = "zh"

# The simulated machine: reads the project's reference/ directory. The relative paths
# '../reference/...' below assume this file sits in configs/ or bin/ (one level below
# the project root); when it sits in the project root use 'reference/FM1' etc.
[[machine]]
name = "REFERENCE"
address = "localhost"
fm1 = '../reference/FM1'
fm2 = '../reference/FM2'
bm = '../reference/BM'

# A remote machine reached over the network (UNC paths).
[[machine]]
name = "AFVI-01"
address = "192.168.10.21"
fm1 = '\\192.168.10.21\AFVI\FM1'
fm2 = '\\192.168.10.21\AFVI\FM2'
bm = '\\192.168.10.21\AFVI\BM'

# A remote machine with a mapped network drive.
[[machine]]
name = "AFVI-02"
address = "192.168.10.22"
fm1 = 'Z:\FM1'
fm2 = 'Z:\FM2'
bm = 'Z:\BM'

# Which face the window opens with: "teach" (teaching program), "studio" (camera studio) or
# "ask" (the picker at startup). One window contains both; the toolbar switches at any time.
# Left out or "ask" asks every start unless remember_last is set.
#start_profile = "ask"

# Remember the face the user switched to last (writes start_profile back into this file).
#remember_last = true

# Also open the other face next to this window at startup (the two are tiled side by side).
#split_start = false
